name: Agentskill

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        name: Checkout Code

        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: airscripts/agentskill/agentskill-actions/validate@2.1.0
        name: Validate Agentskill Documents

        with:
          version: "2.1.0"
          signature: auto
